<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>raftlab</title>
  <meta name="description" content="A Raft cluster you can partition, watch and break." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="masthead">
    <div class="sign">
      <span class="sign-mark" aria-hidden="true"></span>
      <div>
        <h1>raftlab</h1>
        <p>Cluster simulation · five nodes · one leader at a time</p>
      </div>
    </div>
    <div class="plate">
      <span class="plate-key">Ctrl</span>
      <span class="plate-value">tick <b id="stat-tick-head">0</b></span>
    </div>
  </header>

  <main>
    <div class="controls">
      <button id="play" class="btn primary" type="button">Pause</button>
      <button id="split" class="btn" type="button">Partition</button>
      <button id="heal" class="btn" type="button">Heal</button>
      <button id="propose" class="btn" type="button">Propose</button>
      <label class="speed">
        <span>Rate</span>
        <select id="speed">
          <option value="1">1x</option>
          <option value="2" selected>2x</option>
          <option value="4">4x</option>
          <option value="8">8x</option>
        </select>
      </label>
    </div>

    <section class="stage">
      <div class="stage-head">
        <span class="stage-tag">ZONE MAP</span>
        <span class="stage-note">click a node to stop or restart it</span>
      </div>
      <canvas id="canvas"></canvas>
    </section>

    <section class="panels">
      <div class="panel">
        <h2>Cluster state</h2>
        <dl class="stats">
          <div><dt>Term</dt><dd id="stat-term">0</dd></div>
          <div><dt>Leader</dt><dd id="stat-leader">none</dd></div>
          <div><dt>Committed</dt><dd id="stat-commit">0</dd></div>
          <div><dt>In flight</dt><dd id="stat-flight">0</dd></div>
          <div><dt>Dropped</dt><dd id="stat-dropped">0</dd></div>
          <div><dt>Ticks</dt><dd id="stat-tick">0</dd></div>
        </dl>
      </div>

      <div class="panel">
        <h2>Log of events</h2>
        <ol class="trace" id="trace"></ol>
      </div>
    </section>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
